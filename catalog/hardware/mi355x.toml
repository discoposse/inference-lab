# AMD Instinct MI355X (OAM, 8-GPU UBB 2.0 platform), dense datasheet peaks; 288 GB HBM3E, 8 TB/s.
# Compute, memory and link figures: AMD Instinct MI355X GPU brochure (amd.com/content/dam/amd/en/
# documents/instinct-tech-docs/product-briefs/amd-instinct-mi355x-gpu-brochure.pdf), "AI peak
# theoretical performance" table, dense column (sparsity column is 2x); matches the rounded figures on
# amd.com/en/products/accelerators/instinct/mi350/mi355x.html.

name = "MI355X"
# MXFP4 10.0663 PFLOPS (no sparsity figure; MXFP6 runs at the same 10.0663 PFLOPS).
flops_fp4 = 1.00663e16
# OCP-FP8 (E4M3/E5M2) 5.0332 PFLOPS dense (10.0664 with sparsity); MXFP8 is also 5.0332.
flops_fp8 = 5.0332e15
# BF16 matrix 2.5166 PFLOPS dense (5.0332 with sparsity).
flops_bf16 = 2.5166e15
# FP16 matrix 2.5166 PFLOPS dense (5.0332 with sparsity).
flops_fp16 = 2.5166e15
# 8 TB/s peak HBM3E bandwidth.
memory_bandwidth = 8.0e12
# 288 GB HBM3E.
memory_capacity = 288000000000

# Fabric: 8 OAMs on a fully meshed Infinity Fabric (AMD Instinct MI355X platform brochure, amd.com/
# content/dam/amd/en/documents/instinct-tech-docs/product-briefs/amd-instinct-miI355x-platform-
# brochure.pdf: "each MI355X connects with its peers through seven links", 153.6 GB/s bidirectional
# each). scale_up = 7 links x 76.8 GB/s per direction = 537.6 GB/s per GPU: the full 8-GPU mesh; a
# group of g < 8 ranks has only g-1 direct links to its peers ((g-1) x 76.8 GB/s), so narrower groups
# are priced optimistically. Point-to-point mesh, no switch: no in-network reduction. Daytona
# documents MI355X sandboxes of up to 8 GPUs (daytona.io/docs/en/sandboxes) and no inter-node
# network; scale_out is the reference MI355X node instead: one 400 Gb/s NIC per GPU (AMD's supported
# MI350-series NICs are all 400 Gb/s, instinct.docs.amd.com/projects/cluster-documentation/latest/
# reference/hardware-support.html; GPU:NIC 1:1 on Crusoe's MI355X nodes with Pollara 400, crusoe.ai/
# resources/blog/virtualizing-amd-instinct-tm-mi355x-gpus-with-amd-pensando-tm-pollara-400-ai-nic-on-
# linux-kvm) = 50 GB/s per direction. Per-call latencies are the b300/h100 presets' values, not
# measured on MI355X.
[fabric]
gpus_per_node = 8
scale_up = { bandwidth = 5.376e11, latency = 5e-6 }
scale_out = { bandwidth = 5.0e10, latency = 2e-5 }

# KV memory beyond HBM (see docs: [memory]). Host DRAM is the Daytona sandbox's: "each GPU adds up to
# 16 vCPUs, 192GB RAM" (daytona.io/docs/en/sandboxes), so a per-GPU store of 192 GB, reached over the
# GPU's PCIe Gen5 x16 host link (brochure: "1 PCIe Gen 5 x16 (128 GB/s)" = 64 GB/s per direction).
# Daytona publishes no local NVMe throughput, so no NVMe store. `infinity_fabric` and `nic` restate the
# fabric for the memory graph: the GPU's mesh links into the node's scale-up fabric, one NIC per GPU to
# the network core (reference node, as above).
[memory]
[[memory.stores]]
name = "host_dram"
per = "gpu"
capacity = 1.92e11

[[memory.links]]
name = "pcie"
from = "gpu"
to = "host_dram"
bandwidth = 6.4e10

[[memory.links]]
name = "infinity_fabric"
from = "gpu"
to = "switch"
bandwidth = 5.376e11

[[memory.links]]
name = "nic"
from = "gpu"
to = "network"
bandwidth = 5.0e10
