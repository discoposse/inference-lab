# zai-org/GLM-5.3 — MLA + DeepSeek-style sparse attention (DSA) + MoE, FP8.
# Architecture: HF zai-org/GLM-5.3 config.json (model_type glm_moe_dsa) is
# key-for-key identical to zai-org/GLM-5.2-FP8's apart from
# transformers_version, so the layer classes are glm-5.2-fp8.toml's:
#   78 layers, hidden 6144, 64 heads; MLA kv_lora_rank 512 + qk_rope 64
#   (qk_nope 192, v_head 256), q_lora_rank 2048; DSA indexer 32 heads x 128,
#   index_topk 2048; indexer_types: 21 'full' + 57 'shared' (reuse a
#   neighbour's scores); first 3 layers dense (inter 12288), 75 MoE layers
#   of 256 routed + 1 shared expert (moe_intermediate 2048), 8 per token;
#   vocab 154880 (untied); 1 MTP layer (layer 78, not modelled).
# The checkpoint is FP8 (quantization_config: fp8 e4m3, 128x128 blocks);
# KV at --kv-cache-dtype fp8_e4m3.
#
# Param split, exact from the checkpoint's safetensors headers (layers 0-77;
# norms, biases and scale_inv tensors omitted):
#   per expert = 3*6144*2048 = 37_748_736
#   fp8 experts:  active  (8 routed + 1 shared) * per * 75 = 25_480_396_800
#                 resident (256 + 1)            * per * 75 = 727_606_886_400
#   fp8 non-expert: MLA projections (q_a 2048x6144, q_b 16384x2048,
#     kv_a 576x6144, kv_b 28672x512, o 6144x16384) = 165_019_648 x 78
#     = 12_871_532_544; indexer wq_b 4096x2048 + wk 128x6144 = 9_175_040
#     x 21 = 192_675_840; dense FFN 3 x 3*6144*12288 = 679_477_248
#     -> 13_743_685_632
#   bf16: lm_head 154880x6144 = 951_582_720; router 75 x 256x6144
#     = 117_964_800; indexer weights_proj 21 x 32x6144 = 4_128_768
#     -> active 1_073_676_288; + embedding 951_582_720 -> resident
#     2_025_259_008
# Against glm-5.2-fp8.toml (same architecture): that entry carries the
# bf16 lm_head and router in its fp8 stream and prices the indexer query
# from the hidden state (6144x4096) rather than the q latent (2048x4096),
# 348M params more; this split follows the checkpoint's tensors.
#
# Modelled directly: 78 DSA MLA layers, top-2048 selection over the
# uncompressed history; 21 layers run their own 32 x 128 indexer, 57 reuse a
# neighbour's scores; attention priced with the true head shape 64 x (256+256).

name = "GLM-5.3"
hidden_dim = 6144
max_seq_len = 1048576
attention_precision = "bf16"

[[weights]]
precision = "fp8"
active_params = 25480396800
resident_params = 727606886400
routing = { routed_experts = 256, experts_per_tok = 8, moe_layers = 75 }

[[weights]]
precision = "fp8"
active_params = 13743685632
resident_params = 13743685632

[[weights]]
precision = "bf16"
active_params = 1073676288
resident_params = 2025259008

[[layers]]
kind = "mla"
count = 21
latent_dim = 512
q_latent_dim = 2048
rope_dim = 64
kv_precision = "fp8"
window = 0
history = { compress_ratio = 1, index_topk = 2048, indexer = { heads = 32, head_dim = 128, kv_precision = "fp8", precision = "fp8" } }
heads = 64
qk_head_dim = 256
v_head_dim = 256

[[layers]]
kind = "mla"
count = 57
latent_dim = 512
q_latent_dim = 2048
rope_dim = 64
kv_precision = "fp8"
window = 0
history = { compress_ratio = 1, index_topk = 2048 }
heads = 64
qk_head_dim = 256
v_head_dim = 256
